[package]
name = "tealr_doc_gen_lib"
version = "0.1.0"
edition = "2024"

[features]
default = ["html", "definitions", "default_templates"]

lua54 = ["tealr/mlua_lua54"]
lua53 = ["tealr/mlua_lua53"]
lua52 = ["tealr/mlua_lua52"]
lua51 = ["tealr/mlua_lua51"]
luau = ["tealr/mlua_luau"]

html = ["tealr_doc_gen_core/html"]
definitions = ["tealr_doc_gen_core/definitions"]
# When enabled, the default html and teal definition templates are included
default_templates = []


[dependencies]
tealr = { version = "0.11.0", path = "../../", features = ["mlua"] }
tealr_doc_gen_core = { version = "0.1.0", path = "../core", features = [
    "lua_support",
] }
serde_json = "1.0.149"
pulldown-cmark = "0.12.2"

[package.metadata.docs.rs]
# To doc all features
features = ["html", "definitions", "default_templates", "lua54"]
# You would see why we do this later
# As a side note, docs.rs build doc with nightly cargo 
rustdoc-args = ["--cfg", "docsrs"]
