[package]
name = "tealr_doc_gen"
version = "0.1.0"
edition = "2024"

[features]


[dependencies]
tealr = { version = "0.11.0", path = "../../", features = [
    "mlua",
    "mlua_lua54",
    "mlua_vendored",
    "mlua_anyhow",
] }
tealr_doc_gen_lib = { version = "0.1.0", path = "../lib", features = [
    "lua54",
    "html",
    "definitions",
    "default_templates",
] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.104"
clap = { version = "4.6.7" }
